<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11131b">
  <title>Groovebox — CD Library</title>
  <style>
    :root{color-scheme:dark;--bg:#11131b;--panel:#191c27;--panel2:#202431;--text:#f2f1f8;--muted:#a4a7b6;--line:#303443;--accent:#ba9bff;--accent2:#86e3c0;--danger:#ff858b;--shadow:0 12px 32px #0003}
    [data-theme=light]{color-scheme:light;--bg:#f5f4f8;--panel:#fff;--panel2:#f0eef5;--text:#262433;--muted:#6e6c7d;--line:#e2dfea;--accent:#6941bd;--accent2:#167a57;--danger:#bd3145;--shadow:0 10px 28px #25203a12}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:var(--accent)}.shell{max-width:1440px;margin:auto;padding:28px clamp(16px,4vw,56px) 64px}
    header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:34px}.brand{display:flex;align-items:center;gap:13px}.logo{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;background:var(--accent);color:#201632;font-size:23px}.brand h1{font-size:19px;line-height:1.15;margin:0;letter-spacing:-.4px}.brand small{color:var(--muted)}.head-actions{display:flex;gap:10px;align-items:center}
    .btn{border:1px solid var(--line);background:var(--panel);color:var(--text);padding:9px 14px;border-radius:10px;font-weight:650;transition:.15s}.btn:hover{border-color:var(--accent);transform:translateY(-1px)}.btn.primary{background:var(--accent);border-color:var(--accent);color:#21172e}.btn.ghost{background:transparent}.btn.danger{color:var(--danger)}.btn.small{padding:6px 10px;font-size:13px}
    .hero{display:flex;justify-content:space-between;align-items:flex-end;gap:18px;margin-bottom:22px}.eyebrow{color:var(--accent);font-size:11px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}.hero h2{font-size:clamp(27px,4vw,38px);line-height:1.15;letter-spacing:-1.2px;margin:5px 0}.hero p{margin:8px 0 0;color:var(--muted)}.stats{display:flex;gap:10px;flex-wrap:wrap}.stat{min-width:112px;padding:12px 16px;border-radius:14px;background:var(--panel);border:1px solid var(--line)}.stat b{display:block;font-size:21px}.stat span{font-size:12px;color:var(--muted)}
    .toolbar{display:flex;align-items:center;gap:10px;margin:24px 0 16px;flex-wrap:wrap}.search{position:relative;flex:1;min-width:220px}.search input{width:100%;padding:12px 15px 12px 42px;border-radius:12px;background:var(--panel);border:1px solid var(--line);color:var(--text);outline:none}.search input:focus,.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}.search:before{content:"⌕";position:absolute;left:15px;top:8px;font-size:24px;color:var(--muted)}.views{display:flex;gap:4px;padding:4px;border:1px solid var(--line);background:var(--panel);border-radius:11px}.views button{border:0;background:transparent;color:var(--muted);padding:7px 11px;border-radius:8px}.views button.active{background:var(--panel2);color:var(--text)}
    .section-title{display:flex;align-items:center;justify-content:space-between;margin:30px 0 13px}.section-title h3{font-size:17px;margin:0}.section-title span{color:var(--muted);font-size:13px}
    .tabs{display:flex;gap:8px;margin:22px 0 0;border-bottom:1px solid var(--line)}.tab{border:0;border-bottom:2px solid transparent;padding:11px 15px;margin-bottom:-1px;background:transparent;color:var(--muted);font-weight:700}.tab.active{color:var(--accent);border-bottom-color:var(--accent)}.tab-panel[hidden]{display:none}
    .slot-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.slot{border:1px solid var(--line);background:var(--panel);color:var(--text);text-align:left;border-radius:10px;padding:9px;min-height:76px;display:flex;flex-direction:column;justify-content:space-between;gap:6px;overflow:hidden}.slot.filled{background:color-mix(in srgb,var(--accent2) 11%,var(--panel));border-color:color-mix(in srgb,var(--accent2) 38%,var(--line))}.slot-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px}.slot-num{font-weight:800;color:var(--text)}.slot-content{display:flex;align-items:center;gap:8px;min-width:0}.slot-cover{width:36px;height:36px;flex:0 0 36px;border-radius:5px;object-fit:cover;background:var(--panel2)}.slot-cover-placeholder{display:grid;place-items:center;color:var(--accent);font-size:19px}.slot-copy{min-width:0}.slot-name{display:block;font-weight:650;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slot-artist{display:block;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.slot.empty{color:var(--muted)}.slot.empty .slot-name{font-weight:500}
    .slot-tooltip{position:fixed;z-index:40;width:min(340px,calc(100vw - 24px));max-height:min(360px,calc(100vh - 24px));overflow:auto;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:0 14px 40px #0006;pointer-events:none}.slot-tooltip[hidden]{display:none}.slot-tooltip h4{margin:0 0 3px;font-size:15px}.slot-tooltip .tooltip-meta{margin:0 0 10px;color:var(--muted);font-size:12px}.slot-tooltip h5{margin:0 0 5px;font-size:12px;color:var(--accent)}.slot-tooltip ol{margin:0;padding-left:22px;font-size:12px}.slot-tooltip li{padding:2px 0}.slot-tooltip .track-artist{color:var(--muted)}.slot-tooltip .no-tracks{color:var(--muted);font-size:12px}
    .cd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(205px,1fr));gap:16px}.cd-card{border:1px solid var(--line);border-radius:15px;background:var(--panel);overflow:hidden;box-shadow:var(--shadow);transition:.18s}.cd-card:hover{transform:translateY(-3px);border-color:color-mix(in srgb,var(--accent) 60%,var(--line))}.cover{aspect-ratio:1/1;background:linear-gradient(145deg,#322c48,#181a25);display:grid;place-items:center;overflow:hidden;color:#c1addf;font-size:50px;position:relative}.cover img{width:100%;height:100%;object-fit:cover}.card-body{padding:13px}.card-body h4{margin:0 0 3px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card-body p{margin:0;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-flex;align-items:center;gap:5px;border-radius:30px;padding:4px 8px;background:var(--panel2);font-size:11px;color:var(--muted);margin-top:11px}.badge.loaded{color:var(--accent2);background:color-mix(in srgb,var(--accent2) 13%,var(--panel))}.card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:10px}.card-actions{display:flex;gap:5px}
    .detail-view{display:flex;flex-direction:column;gap:10px}.detail-row{display:grid;grid-template-columns:90px minmax(140px,.75fr) minmax(260px,1.5fr) 100px minmax(160px,auto);gap:14px;align-items:center;padding:13px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.detail-row>div{min-width:0}.detail-row img{display:block;width:90px;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--panel2)}.detail-row h4{margin:0}.detail-row p{margin:4px 0;color:var(--muted);font-size:13px}.detail-row .year{color:var(--muted);font-size:12px}.track-preview{max-height:72px;overflow:hidden;color:var(--muted);font-size:12px}.detail-row>div:nth-child(4){justify-self:center}.detail-row>.card-actions{display:flex;align-items:center;justify-content:flex-end;gap:5px;min-height:40px;white-space:nowrap}
    .track-table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
    .track-table{width:100%;border-collapse:collapse;text-align:left}
    .track-table th,.track-table td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:top}
    .track-table th{position:sticky;top:0;background:var(--panel2);font-size:12px;color:var(--muted);white-space:nowrap}
    .track-table tbody tr:last-child td{border-bottom:0}
    .track-table tbody tr:hover{background:var(--panel2)}
    .track-table td:first-child{font-weight:650}
    .track-table .track-muted{color:var(--muted)}
    .track-table .track-slot{white-space:nowrap}
    .track-empty{padding:36px 18px;text-align:center;color:var(--muted)}
    .empty-state{padding:44px 20px;text-align:center;border:1px dashed var(--line);border-radius:16px;color:var(--muted)}.empty-state b{color:var(--text);display:block;font-size:16px;margin-bottom:5px}
    .toast{position:fixed;right:20px;bottom:20px;padding:12px 17px;border-radius:11px;background:var(--text);color:var(--bg);box-shadow:var(--shadow);z-index:30;max-width:min(420px,calc(100vw - 40px))}.toast.error{background:var(--danger);color:white}
    .modal-backdrop{position:fixed;inset:0;z-index:20;background:#05050ab9;display:grid;place-items:center;padding:16px;overflow-y:auto}.modal{width:min(720px,100%);max-height:94vh;overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:17px;padding:22px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h3{margin:0;font-size:20px}.close{border:0;background:transparent;color:var(--muted);font-size:25px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:5px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700;color:var(--muted)}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:var(--bg);color:var(--text);outline:none}.field textarea{min-height:115px;resize:vertical}.hint{font-size:11px;color:var(--muted)}.modal-footer{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.import-bar{display:flex;gap:8px;align-items:center;margin:12px 0}.import-bar select,.import-bar input{border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--text);padding:9px}.import-bar input{flex:1;min-width:80px}.candidate{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}.candidate p{margin:0}.candidate small{display:block;color:var(--muted)}.candidate-list{max-height:230px;overflow-y:auto}.tracks{display:flex;flex-direction:column;gap:7px}.track-row{display:grid;grid-template-columns:28px 1fr 100px 85px 30px;gap:6px;align-items:center}.track-row input{padding:7px!important;font-size:13px}.track-row .track-index{color:var(--muted);font-size:12px;text-align:center}.remove-track{border:0;background:transparent;color:var(--danger);font-size:19px}.info{font-size:12px;color:var(--muted)}
    @media(max-width:720px){.shell{padding-top:17px}.hero{align-items:flex-start;flex-direction:column}.stat{min-width:95px}.detail-row{grid-template-columns:70px minmax(0,1fr) auto;align-items:center}.detail-row img{width:70px}.detail-row .track-preview,.detail-row .year,.detail-row>div:nth-child(4){display:none}.detail-row>.card-actions{justify-content:flex-end}.slot-grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}}
    @media(max-width:480px){header{align-items:flex-start}.brand small{display:block}.head-actions{gap:5px}.head-actions .btn{padding:8px}.hero h2{font-size:28px}.form-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.import-bar{flex-wrap:wrap}.import-bar input{flex-basis:100%;order:3}.views button{padding:7px 8px}.track-row{grid-template-columns:22px 1fr 30px}.track-row .track-artist,.track-row .track-duration{display:none}}
      .cover-preview{display:flex;align-items:center;gap:10px;margin-top:8px;color:var(--muted);font-size:12px}.cover-preview[hidden],.cover-preview img[hidden],.cover-preview span[hidden]{display:none}.cover-preview img{width:100px;height:100px;object-fit:cover;border-radius:8px;background:var(--panel2)}
    .candidate-cover-popup{position:fixed;z-index:50;width:220px;padding:7px;border:1px solid var(--line);border-radius:10px;background:var(--panel);box-shadow:var(--shadow);pointer-events:none}
    .candidate-cover-popup[hidden]{display:none}
    .candidate-cover-popup img{display:block;width:100%;aspect-ratio:1;object-fit:contain;border-radius:5px;background:var(--panel2)}
    .slot-picker-grid{display:grid;grid-template-columns:repeat(auto-fill,48px);gap:7px;max-height:min(48vh,420px);overflow-y:auto;padding:2px}
    .slot-choice{width:48px;height:48px;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-weight:700}
    .slot-choice.occupied{border-color:color-mix(in srgb,var(--danger) 65%,var(--line));background:color-mix(in srgb,var(--danger) 17%,var(--panel));color:var(--danger)}
    .slot-choice:hover,.slot-choice[aria-pressed=true]{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 25%,var(--panel));color:var(--text)}
    .slot-zero-picker{display:flex;align-items:center;gap:12px;margin:4px 0 14px}.slot-zero-picker .slot-choice{width:48px;flex:0 0 48px}.slot-zero-picker span{color:var(--muted);font-size:13px}
    .slot-picker-legend{display:flex;gap:16px;margin:0 0 10px;color:var(--muted);font-size:12px}.slot-picker-legend span{display:inline-flex;align-items:center;gap:6px}.slot-picker-legend i{width:11px;height:11px;border-radius:3px;background:var(--bg);border:1px solid var(--line)}.slot-picker-legend .used{background:color-mix(in srgb,var(--danger) 17%,var(--panel));border-color:var(--danger)}
    @media(max-width:600px){.slot-picker-grid{grid-template-columns:repeat(auto-fill,40px);gap:6px}.slot-choice{width:40px;height:40px}.slot-zero-picker .slot-choice{width:40px;flex-basis:40px}}
    .modal{width:min(1000px,100%)}
    .editor-layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(280px,.9fr);gap:22px;align-items:start}
    .editor-fields,.metadata-panel{min-width:0}
    .metadata-panel{padding-left:20px;border-left:1px solid var(--line)}
    .metadata-panel .field{margin-top:0!important}
    @media(max-width:760px){.editor-layout{grid-template-columns:1fr;gap:18px}.metadata-panel{padding:16px 0 0;border-left:0;border-top:1px solid var(--line)}}
  </style>
</head>
<body>
<main class="shell">
  <header>
    <div class="brand"><div class="logo" aria-hidden="true">♫</div><div><h1>Groovebox</h1><small>CD library & changer manager</small></div></div>
    <div class="head-actions"><button id="theme-button" class="btn ghost" aria-label="Switch theme">☼ Light</button><button id="add-button" class="btn primary">＋ Add CD</button></div>
  </header>
  <section class="hero">
    <div><div class="eyebrow">Your collection</div><h2>Find your next track.</h2><p>Every album and song, right where you need it.</p></div>
    <div class="stats"><div class="stat"><b id="total-count">0</b><span>CDs in library</span></div><div class="stat"><b id="loaded-count">0 / 101</b><span>slots occupied</span></div></div>
  </section>
  <nav class="tabs" role="tablist" aria-label="CD collection sections">
    <button id="loaded-tab" class="tab active" role="tab" aria-selected="true" aria-controls="loaded-panel">Loaded CDs</button>
    <button id="library-tab" class="tab" role="tab" aria-selected="false" aria-controls="library-panel">CD Library</button>
    <button id="tracks-tab" class="tab" role="tab" aria-selected="false" aria-controls="tracks-panel">Track Library</button>
  </nav>
  <section id="loaded-panel" class="tab-panel" role="tabpanel" aria-labelledby="loaded-tab">
    <div class="section-title"><h3 id="changer-heading">Changer overview</h3><span id="slot-caption">101 positions · click a slot to load or unload</span></div>
    <div id="slot-grid" class="slot-grid" aria-live="polite"></div>
  </section>
  <section id="library-panel" class="tab-panel" role="tabpanel" aria-labelledby="library-tab" hidden>
    <div class="section-title"><h3>Your CD library</h3><span id="result-count"></span></div>
    <div class="toolbar">
      <label class="search"><input id="search" type="search" placeholder="Search albums, artists, songs…" aria-label="Search albums, artists, and songs"></label>
      <div class="views" role="group" aria-label="Collection view">
        <button data-view="gallery" class="active" aria-label="Gallery view">▦</button><button data-view="detail" aria-label="Detailed view">≡</button>
      </div>
    </div>
    <div id="cd-results"></div>
  </section>
  <section id="tracks-panel" class="tab-panel" role="tabpanel" aria-labelledby="tracks-tab" hidden>
    <div class="section-title"><h3>Track library</h3><span id="track-result-count"></span></div>
    <div class="toolbar">
      <label class="search"><input id="track-search" type="search" placeholder="Search tracks, artists, and albums…" aria-label="Search tracks, artists, and albums"></label>
    </div>
    <div id="track-results"></div>
  </section>
</main>
<div id="slot-tooltip" class="slot-tooltip" role="tooltip" hidden></div><div id="candidate-cover-popup" class="candidate-cover-popup" role="tooltip" hidden><img alt=""></div><div id="modal-root"></div><div id="toast-root" aria-live="polite"></div>
<script>
const $=s=>document.querySelector(s),state={cds:[],slots:[],tracks:[],view:localStorage.getItem("view")==="detail"?"detail":"gallery",query:"",trackQuery:"",theme:localStorage.getItem("theme")||"dark"};
const esc=value=>String(value??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cover=cd=>cd.cover?`<img src="${esc(cd.cover)}" alt="Cover art for ${esc(cd.title)}" loading="lazy">`:"<span aria-hidden=\"true\">♫</span>";
function toast(message,error=false){const el=document.createElement("div");el.className=`toast${error?" error":""}`;el.textContent=message;$("#toast-root").replaceChildren(el);setTimeout(()=>el.remove(),3800)}
async function api(path,options={}){const response=await fetch(path,{headers:{"Content-Type":"application/json",...(options.headers||{})},...options});if(response.status===204)return null;const data=await response.json().catch(()=>({error:"Unexpected server response."}));if(!response.ok)throw Error(data.error||`Request failed (${response.status}).`);return data}
function showTheme(){document.documentElement.dataset.theme=state.theme;$("#theme-button").textContent=state.theme==="dark"?"☼ Light":"☾ Dark"}
function slotCover(cd){return cd.cover?`<img class="slot-cover" src="${esc(cd.cover)}" alt="" loading="lazy">`:'<span class="slot-cover slot-cover-placeholder" aria-hidden="true">♫</span>'}
function renderSlots(){const occupied=state.slots.filter(s=>s.cd).length;$("#loaded-count").textContent=`${occupied} / 101`;$("#slot-grid").innerHTML=state.slots.map(item=>item.cd?`<button class="slot filled" data-slot="${item.slot}" title="${esc(item.cd.artist)} — ${esc(item.cd.title)}; click to unload" aria-describedby="slot-tooltip"><span class="slot-top"><span class="slot-num">${item.slot}</span><span>●</span></span><span class="slot-content">${slotCover(item.cd)}<span class="slot-copy"><span class="slot-name">${esc(item.cd.title)}</span><span class="slot-artist">${esc(item.cd.artist||"Unknown artist")}</span></span></span></button>`:`<button class="slot empty" data-slot="${item.slot}" title="Empty slot ${item.slot}; click to load a CD"><span class="slot-top"><span class="slot-num">${item.slot}</span><span>＋</span></span><span class="slot-name">Empty</span></button>`).join("")}
function showTrackTooltip(cd,trigger){if(!cd)return;const tracks=cd.tracks||[];const tooltip=$("#slot-tooltip");tooltip.innerHTML=tracks.length?`<h5>Track list</h5><ol>${tracks.map(track=>`<li>${esc(track.title)}${track.artist?` <span class="track-artist">— ${esc(track.artist)}</span>`:""}</li>`).join("")}</ol>`:"<p class='no-tracks'>No track list has been added.</p>";tooltip.hidden=false;const rect=trigger.getBoundingClientRect(),width=tooltip.offsetWidth,height=tooltip.offsetHeight;let left=Math.min(rect.left,window.innerWidth-width-12);let top=rect.bottom+8;if(top+height>window.innerHeight-12)top=rect.top-height-8;if(top<12)top=12;left=Math.max(12,left);tooltip.style.left=`${left}px`;tooltip.style.top=`${top}px`}
function showSlotTooltip(button){showTrackTooltip(state.slots[Number(button.dataset.slot)]?.cd,button)}
function showLibraryTooltip(card){showTrackTooltip(state.cds.find(cd=>cd.id===Number(card.dataset.libraryCd)),card)}
function hideSlotTooltip(){const tooltip=$("#slot-tooltip");tooltip.hidden=true;tooltip.replaceChildren()}
function status(cd){return cd.slot!==null&&cd.slot!==undefined?`<span class="badge loaded">● Slot ${cd.slot}</span>`:"<span class=\"badge\">○ Not loaded</span>"}
function card(cd){return `<article class="cd-card" data-library-cd="${cd.id}"><div class="cover">${cover(cd)}</div><div class="card-body"><h4 title="${esc(cd.title)}">${esc(cd.title)}</h4><p>${esc(cd.artist||"Unknown artist")}${cd.year?` · ${esc(cd.year)}`:""}</p><div class="card-bottom">${status(cd)}<span class="card-actions">${cd.slot===null||cd.slot===undefined?`<button class="btn small" data-load-cd="${cd.id}" aria-label="Load ${esc(cd.title)} into a changer slot">Load</button>`:""}<button class="btn small" data-edit="${cd.id}" aria-label="Edit ${esc(cd.title)}">Edit</button><button class="btn small danger" data-delete="${cd.id}" aria-label="Delete ${esc(cd.title)}">×</button></span></div></div></article>`}
function detailRow(cd){const tracks=(cd.tracks||[]).map(t=>t.title).join(" · ");return `<article class="detail-row" data-library-cd="${cd.id}"><div>${cover(cd)}</div><div><h4>${esc(cd.title)}</h4><p>${esc(cd.artist||"Unknown artist")}${cd.year?` · ${esc(cd.year)}`:""}</p><span class="year">${esc(cd.label||"")}${cd.catalog_number?` · ${esc(cd.catalog_number)}`:""}</span></div><div class="track-preview">${esc(tracks||"No track list")}</div><div>${status(cd)}</div><span class="card-actions">${cd.slot===null||cd.slot===undefined?`<button class="btn small" data-load-cd="${cd.id}" aria-label="Load ${esc(cd.title)} into a changer slot">Load</button>`:""}<button class="btn small" data-edit="${cd.id}" aria-label="Edit ${esc(cd.title)}">Edit</button><button class="btn small danger" data-delete="${cd.id}" aria-label="Delete ${esc(cd.title)}">×</button></span></article>`}
function renderCds(){const list=state.cds;$("#total-count").textContent=state.cds.length;$("#result-count").textContent=`${list.length} ${list.length===1?"album":"albums"}`;const root=$("#cd-results");if(!list.length){root.innerHTML=`<div class="empty-state"><b>${state.query?"No matching CDs":"Your library is ready"}</b>${state.query?"Try another album, artist, or track search.":"Add a CD manually or find it in MusicBrainz or Discogs."}</div>`;return}root.className=state.view==="gallery"?"cd-grid":"detail-view";root.innerHTML=list.map(state.view==="gallery"?card:detailRow).join("")}
function renderTracks(){const tracks=state.tracks;$("#track-result-count").textContent=`${tracks.length} ${tracks.length===1?"track":"tracks"}`;const root=$("#track-results");if(!tracks.length){root.innerHTML=`<div class="track-empty">${state.trackQuery?"No matching tracks. Try a different search.":"No tracks in your collection yet."}</div>`;return}root.innerHTML=`<div class="track-table-wrap"><table class="track-table"><thead><tr><th scope="col">Track</th><th scope="col">Artist</th><th scope="col">Album</th><th scope="col">Album artist</th><th scope="col">Year</th><th scope="col">Duration</th><th scope="col">Slot</th></tr></thead><tbody>${tracks.map(track=>`<tr><td>${esc(track.title)}</td><td>${esc(track.artist||"Unknown artist")}</td><td>${esc(track.album)}</td><td>${esc(track.album_artist||"Unknown artist")}</td><td>${esc(track.year||"—")}</td><td>${esc(track.duration||"—")}</td><td class="track-slot">${track.slot===null||track.slot===undefined?'<span class="track-muted">Not loaded</span>':`Slot ${track.slot}`}</td></tr>`).join("")}</tbody></table></div>`}
async function refreshTracks(){try{state.tracks=await api(`/api/tracks?q=${encodeURIComponent(state.trackQuery)}`);renderTracks()}catch(error){toast(error.message,true)}}
function setTab(name){const isLoaded=name==="loaded",isLibrary=name==="library",isTracks=name==="tracks";$("#loaded-panel").hidden=!isLoaded;$("#library-panel").hidden=!isLibrary;$("#tracks-panel").hidden=!isTracks;$("#loaded-tab").classList.toggle("active",isLoaded);$("#loaded-tab").setAttribute("aria-selected",String(isLoaded));$("#library-tab").classList.toggle("active",isLibrary);$("#library-tab").setAttribute("aria-selected",String(isLibrary));$("#tracks-tab").classList.toggle("active",isTracks);$("#tracks-tab").setAttribute("aria-selected",String(isTracks));localStorage.setItem("active-tab",name);if(isTracks)refreshTracks()}
async function refresh(){try{const [cds,slots]=await Promise.all([api(`/api/cds?q=${encodeURIComponent(state.query)}`),api("/api/slots")]);state.cds=cds;state.slots=slots;renderSlots();renderCds()}catch(error){toast(error.message,true)}}
function trackMarkup(tracks=[]){return (tracks.length?tracks:[{title:""}]).map((track,i)=>`<div class="track-row"><span class="track-index">${i+1}</span><input class="track-title" aria-label="Track ${i+1} title" placeholder="Track title" value="${esc(track.title||"")}"><input class="track-artist" aria-label="Track ${i+1} artist" placeholder="Artist" value="${esc(track.artist||"")}"><input class="track-duration" aria-label="Track ${i+1} duration" placeholder="Duration" value="${esc(track.duration||"")}"><button class="remove-track" type="button" aria-label="Remove track">×</button></div>`).join("")}
function showCoverPreview(url){const preview=$("#cover-preview");if(!preview)return;const image=preview.querySelector("img"),message=preview.querySelector("span");image.hidden=true;message.hidden=false;preview.hidden=false;if(!url){message.textContent="No cover art available for this release.";return}message.textContent="Loading cover…";image.onload=()=>{message.hidden=true;image.hidden=false};image.onerror=()=>{message.textContent="Cover image could not be loaded.";message.hidden=false};image.src=url}
function showCandidateCover(candidate){const button=candidate.querySelector("[data-candidate]"),result=state.metadataResults?.[Number(button?.dataset.candidate)],url=result?.cover_url;if(!url)return;const popup=$("#candidate-cover-popup"),image=popup.querySelector("img");image.alt=`Cover art for ${result.title||"album"}`;image.onerror=()=>{popup.hidden=true};image.onload=()=>{const rect=candidate.getBoundingClientRect(),width=popup.offsetWidth,height=popup.offsetHeight;let left=rect.right+8;if(left+width>window.innerWidth-8)left=rect.left-width-8;popup.style.left=`${Math.max(8,left)}px`;popup.style.top=`${Math.max(8,Math.min(rect.top,window.innerHeight-height-8))}px`;popup.hidden=false};popup.hidden=true;image.src=url}
function hideCandidateCover(){const popup=$("#candidate-cover-popup");if(popup)popup.hidden=true}
document.addEventListener("pointerover",e=>{const candidate=e.target.closest(".candidate");if(candidate&&!candidate.contains(e.relatedTarget))showCandidateCover(candidate)});
document.addEventListener("pointerout",e=>{const candidate=e.target.closest(".candidate");if(candidate&&!candidate.contains(e.relatedTarget))hideCandidateCover()});
document.addEventListener("focusin",e=>{const candidate=e.target.closest(".candidate");if(candidate)showCandidateCover(candidate)});
document.addEventListener("focusout",e=>{if(e.target.closest(".candidate"))hideCandidateCover()});
function openEditor(cd=null,slot=null){const item=cd||{};const modal=$("#modal-root");modal.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="editor-title"><div class="modal-head"><h3 id="editor-title">${cd?"Edit CD":"Add a CD"}</h3><button class="close" aria-label="Close">×</button></div><form id="cd-form"><div class="form-grid"><div class="field"><label for="album-title">Album title *</label><input id="album-title" name="title" required maxlength="300" value="${esc(item.title)}"></div><div class="field"><label for="artist">Artist</label><input id="artist" name="artist" maxlength="300" value="${esc(item.artist)}"></div><div class="field"><label for="year">Release year</label><input id="year" name="year" maxlength="20" value="${esc(item.year)}"></div><div class="field"><label for="label">Label</label><input id="label" name="label" maxlength="300" value="${esc(item.label)}"></div><div class="field"><label for="catalog-number">Catalog number / edition</label><input id="catalog-number" name="catalog_number" maxlength="100" value="${esc(item.catalog_number)}"></div><div class="field"><label for="cover-file">Cover image</label><input id="cover-file" name="cover" type="file" accept="image/png,image/jpeg,image/webp,image/gif"><span class="hint">JPEG, PNG, WebP or GIF · max 5 MB</span><div id="cover-preview" class="cover-preview" hidden><img alt="Selected CD cover preview"><span>Cover image could not be loaded.</span></div></div><div class="field full"><label>Track list</label><div id="tracks" class="tracks">${trackMarkup(item.tracks)}</div><button id="add-track" class="btn small" type="button">＋ Add track</button></div></div><div class="field" style="margin-top:12px"><label>Find metadata online using the album title and artist above</label><div class="import-bar"><select id="source" aria-label="Metadata source"><option value="discogs" selected>Discogs</option><option value="musicbrainz">MusicBrainz</option></select><button id="metadata-search" class="btn small" type="button">Search metadata</button></div><div id="candidate-list" class="candidate-list"></div><p class="info">Search uses the album title and artist fields above. Select a result to fill the entry fields, then review and save. Discogs requires a configured consumer key and secret or personal access token.</p></div><div class="modal-footer"><button type="button" class="btn cancel">Cancel</button><button class="btn primary" type="submit">${cd?"Save changes":"Add to library"}</button></div></form></section></div>`;
  const form=$("#cd-form"),fields=form.querySelector(".form-grid"),metadata=fields.nextElementSibling,layout=document.createElement("div"),editorFields=document.createElement("div"),metadataPanel=document.createElement("aside");layout.className="editor-layout";editorFields.className="editor-fields";metadataPanel.className="metadata-panel";form.insertBefore(layout,fields);layout.append(editorFields,metadataPanel);editorFields.append(fields);metadataPanel.append(metadata);
  const close=()=>modal.replaceChildren();modal.querySelector(".close").onclick=close;modal.querySelector(".cancel").onclick=close;modal.querySelector(".modal-backdrop").addEventListener("click",e=>{if(e.target===e.currentTarget)close()});$("#album-title").focus();showCoverPreview(item.cover_url||"");
  $("#add-track").onclick=()=>$("#tracks").insertAdjacentHTML("beforeend",trackMarkup([{title:""}]));
  $("#tracks").onclick=e=>{if(e.target.closest(".remove-track")){const rows=$("#tracks").querySelectorAll(".track-row");if(rows.length>1)e.target.closest(".track-row").remove();else e.target.closest(".track-row").querySelector("input").value=""}};
  const runMetadataSearch=async()=>{const title=$("#cd-form [name=\"title\"]").value.trim();const artist=$("#cd-form [name=\"artist\"]").value.trim();const year=$("#cd-form [name=\"year\"]").value.trim();if(!title&&!artist&&!year){toast("Enter an album title, artist, or release year in the fields above before searching.",true);return}const params=new URLSearchParams({title,artist,year});const button=$("#metadata-search");button.disabled=true;button.textContent="Searching…";try{const results=await api(`/api/metadata/${$("#source").value}?${params.toString()}`);const candidates=$("#candidate-list");if(!results.length){candidates.innerHTML="<p class='info'>No matching releases found. Try adjusting the album title, artist, or year above.</p>";return}state.metadataResults=results;candidates.innerHTML=results.map((result,i)=>`<div class="candidate"><p><b>${esc(result.title)}</b><small>${esc(result.artist||"Artist not listed")}${result.year?` · ${esc(result.year)}`:""}${result.label?` · ${esc(result.label)}`:""}</small></p><button class="btn small" type="button" data-candidate="${i}">Fill entry fields</button></div>`).join("");candidates.onclick=async e=>{const choose=e.target.closest("[data-candidate]");if(!choose)return;let result=results[Number(choose.dataset.candidate)];try{if(result.source==="Discogs")result=await api(`/api/metadata/discogs/${encodeURIComponent(result.release_id)}`);else if(result.source==="MusicBrainz")result=await api(`/api/metadata/musicbrainz/${encodeURIComponent(result.release_id)}`);for(const key of ["title","artist","year","label","catalog_number"])$(`[name="${key}"]`).value=result[key]||"";item.release_id=result.release_id||"";item.metadata_source=result.source||"";item.cover_url=result.cover_url||"";showCoverPreview(item.cover_url);$("#tracks").innerHTML=trackMarkup(result.tracks||[]);toast("Release details filled in. Review them, then save.")}catch(error){toast(error.message,true)}}}catch(error){toast(error.message,true)}finally{button.disabled=false;button.textContent="Search metadata"}};
  $("#metadata-search").onclick=runMetadataSearch;
  $("#cd-form").onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,formData=new FormData(form),file=$("#cover-file").files[0];let coverData="",coverMime="";if(file){if(file.size>5*1024*1024){toast("Cover image must be smaller than 5 MB.",true);return}coverData=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(",")[1]);reader.onerror=()=>reject(Error("Could not read cover image."));reader.readAsDataURL(file)});coverMime=file.type}const tracks=[...$("#tracks").querySelectorAll(".track-row")].map(row=>({title:row.querySelector(".track-title").value.trim(),artist:row.querySelector(".track-artist").value.trim(),duration:row.querySelector(".track-duration").value.trim()})).filter(track=>track.title);const payload={title:formData.get("title"),artist:formData.get("artist"),year:formData.get("year"),label:formData.get("label"),catalog_number:formData.get("catalog_number"),tracks,cover_data:coverData,cover_mime:coverMime,cover_url:item.cover_url||"",release_id:item.release_id||"",metadata_source:item.metadata_source||""};try{const saved=await api(cd?`/api/cds/${cd.id}`:"/api/cds",{method:cd?"PUT":"POST",body:JSON.stringify(payload)});if(slot!==null)await api(`/api/slots/${slot}`,{method:"POST",body:JSON.stringify({cd_id:saved.id})});close();await refresh();toast(cd?"CD details saved.":"CD added to your library.")}catch(error){toast(error.message,true)}};
}
document.addEventListener("pointerover",e=>{const button=e.target.closest(".slot.filled");if(button&&!button.contains(e.relatedTarget)){showSlotTooltip(button);return}const card=e.target.closest("[data-library-cd]");if(card&&!card.contains(e.relatedTarget))showLibraryTooltip(card)});document.addEventListener("pointerout",e=>{const button=e.target.closest(".slot.filled"),card=e.target.closest("[data-library-cd]");if((button&&!button.contains(e.relatedTarget))||(card&&!card.contains(e.relatedTarget)))hideSlotTooltip()});document.addEventListener("focusin",e=>{const button=e.target.closest(".slot.filled"),card=e.target.closest("[data-library-cd]");if(button)showSlotTooltip(button);else if(card)showLibraryTooltip(card)});document.addEventListener("focusout",e=>{if(e.target.closest(".slot.filled,[data-library-cd]"))hideSlotTooltip()});
document.addEventListener("click",async e=>{const load=e.target.closest("[data-load-cd]");if(load){const cd=state.cds.find(item=>item.id===Number(load.dataset.loadCd));if(cd)openCdSlotPicker(cd);return}const edit=e.target.closest("[data-edit]");if(edit){const cd=state.cds.find(x=>x.id===Number(edit.dataset.edit))||state.slots.find(s=>s.cd?.id===Number(edit.dataset.edit))?.cd||await api(`/api/cds/${edit.dataset.edit}`);openEditor(cd);return}const del=e.target.closest("[data-delete]");if(del){const cd=state.cds.find(x=>x.id===Number(del.dataset.delete))||state.slots.find(s=>s.cd?.id===Number(del.dataset.delete))?.cd;if(!confirm(`Permanently remove “${cd?.title||"this CD"}” and its track list from your library?`))return;try{await api(`/api/cds/${del.dataset.delete}`,{method:"DELETE"});await refresh();toast("CD removed from the library.")}catch(error){toast(error.message,true)}return}const slotButton=e.target.closest("[data-slot]");if(slotButton){hideSlotTooltip();const slot=Number(slotButton.dataset.slot),current=state.slots[slot];if(current?.cd){if(!confirm(`Unload “${current.cd.title}” from slot ${slot}? It will remain in your library.`))return;try{await api(`/api/slots/${slot}`,{method:"DELETE"});await refresh();toast(`CD unloaded from slot ${slot}.`)}catch(error){toast(error.message,true)}return}try{const allCds=await api("/api/cds"),available=allCds;if(!available.length){toast("Add a CD before loading this slot.",true);return}openSlotPicker(slot,available)}catch(error){toast(error.message,true)}}});
function openCdSlotPicker(cd){const root=$("#modal-root"),slotZero=state.slots[0],otherSlots=state.slots.slice(1);root.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="load-cd-title"><div class="modal-head"><h3 id="load-cd-title">Load ${esc(cd.title)}</h3><button class="close" aria-label="Close">×</button></div><div class="field"><label>Choose a changer slot</label><div class="slot-picker-legend"><span><i></i>Empty</span><span><i class="used"></i>Occupied — selecting replaces its CD</span></div><div class="slot-zero-picker"><button class="slot-choice${slotZero.cd?" occupied":""}" type="button" data-slot-choice="0" aria-pressed="false" aria-label="Slot 0${slotZero.cd?`, occupied by ${esc(slotZero.cd.artist||"Unknown artist")} — ${esc(slotZero.cd.title)}`:", empty"}" title="${slotZero.cd?`${esc(slotZero.cd.artist||"Unknown artist")} — ${esc(slotZero.cd.title)}`:"Special-use slot"}">0</button><span>${slotZero.cd?`Occupied by ${esc(slotZero.cd.title)}`:"Special-use slot"}</span></div><div id="cd-slot-picker" class="slot-picker-grid" role="group" aria-label="Changer slots 1 to 100">${otherSlots.map(item=>`<button class="slot-choice${item.cd?" occupied":""}" type="button" data-slot-choice="${item.slot}" aria-pressed="false" aria-label="Slot ${item.slot}${item.cd?`, occupied by ${esc(item.cd.artist||"Unknown artist")} — ${esc(item.cd.title)}`:", empty"}" title="${item.cd?`${esc(item.cd.artist||"Unknown artist")} — ${esc(item.cd.title)}`:`Empty slot ${item.slot}`}">${item.slot}</button>`).join("")}</div></div><div class="modal-footer"><button class="btn cancel" type="button">Cancel</button><button class="btn primary" id="confirm-cd-load" type="button" disabled>Load CD</button></div></section></div>`;const close=()=>root.replaceChildren();root.querySelector(".close").onclick=close;root.querySelector(".cancel").onclick=close;let selectedSlot=null;const picker=$("#cd-slot-picker"),zeroPicker=root.querySelector(".slot-zero-picker");const selectSlot=choice=>{selectedSlot=Number(choice.dataset.slotChoice);root.querySelectorAll("[data-slot-choice]").forEach(button=>button.setAttribute("aria-pressed",String(button===choice)));const replacing=Boolean(state.slots[selectedSlot]?.cd);$("#confirm-cd-load").textContent=replacing?"Replace CD":"Load CD";$("#confirm-cd-load").disabled=false};picker.onclick=e=>{const choice=e.target.closest("[data-slot-choice]");if(choice)selectSlot(choice)};zeroPicker.onclick=e=>{const choice=e.target.closest("[data-slot-choice]");if(choice)selectSlot(choice)};$("#confirm-cd-load").onclick=async()=>{if(selectedSlot===null)return;const occupied=state.slots[selectedSlot]?.cd;try{await api(`/api/slots/${selectedSlot}`,{method:"POST",body:JSON.stringify({cd_id:cd.id,move:cd.slot!==null&&cd.slot!==undefined,replace:Boolean(occupied&&occupied.id!==cd.id)})});close();await refresh();toast(occupied&&occupied.id!==cd.id?`${cd.title} replaced ${occupied.title} in slot ${selectedSlot}.`:`${cd.title} loaded into slot ${selectedSlot}.`)}catch(error){toast(error.message,true)}}}
function openSlotPicker(slot,available){const root=$("#modal-root");root.innerHTML=`<div class="modal-backdrop"><section class="modal" role="dialog" aria-modal="true"><div class="modal-head"><h3>Load a CD into slot ${slot}</h3><button class="close" aria-label="Close">×</button></div><div class="field"><label for="slot-select">Choose a CD</label><select id="slot-select">${available.map(cd=>`<option value="${cd.id}">${esc(cd.title)} — ${esc(cd.artist||"Unknown artist")}${cd.slot!==null&&cd.slot!==undefined?` (move from slot ${cd.slot})`:""}</option>`).join("")}</select></div><div class="modal-footer"><button class="btn cancel">Cancel</button><button class="btn primary" id="confirm-load">Load into slot</button></div></section></div>`;const close=()=>root.replaceChildren();root.querySelector(".close").onclick=close;root.querySelector(".cancel").onclick=close;$("#confirm-load").onclick=async()=>{const selected=available.find(cd=>cd.id===Number($("#slot-select").value));try{await api(`/api/slots/${slot}`,{method:"POST",body:JSON.stringify({cd_id:selected.id,move:selected.slot!==null&&selected.slot!==undefined})});close();await refresh();toast(`${selected.title} loaded into slot ${slot}.`)}catch(error){toast(error.message,true)}}}
$("#add-button").onclick=()=>openEditor();$("#theme-button").onclick=()=>{state.theme=state.theme==="dark"?"light":"dark";localStorage.setItem("theme",state.theme);showTheme()};$("#search").oninput=e=>{state.query=e.target.value;clearTimeout(window.searchTimer);window.searchTimer=setTimeout(refresh,180)};$("#track-search").oninput=e=>{state.trackQuery=e.target.value;clearTimeout(window.trackSearchTimer);window.trackSearchTimer=setTimeout(refreshTracks,180)};document.querySelectorAll("[data-view]").forEach(button=>button.onclick=()=>{state.view=button.dataset.view;localStorage.setItem("view",state.view);document.querySelectorAll("[data-view]").forEach(b=>b.classList.toggle("active",b===button));renderCds()});
showTheme();document.querySelector(`[data-view="${state.view}"]`).classList.add("active");$("#loaded-tab").onclick=()=>setTab("loaded");$("#library-tab").onclick=()=>setTab("library");$("#tracks-tab").onclick=()=>setTab("tracks");setTab("loaded");refresh();
</script>
