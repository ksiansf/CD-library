<body>
<main class="shell">
  <header>
    <div class="brand"><div class="logo" aria-hidden="true">♫</div><div><h1>Groovebox</h1><small>CD library & changer manager</small></div></div>
    <div class="header-changer-frame"><img src="/media/PD-F958.png" alt="Pioneer PD-F958 101-disc CD changer"></div>
    <div class="head-actions"><button id="theme-button" class="btn ghost" aria-label="Switch theme">☼ Light</button></div>
  </header>
  <nav class="tabs" role="tablist" aria-label="CD collection sections">
